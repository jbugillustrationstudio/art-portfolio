<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3"></script>

    <link rel="stylesheet" href="style.css" />

    <title>Art Portfolio Home Page</title>
  </head>
  <body>
    <main class="min-h-screen w-full relative bg-[#E7DFD3]">
      <!-- Beach background effects Start -->
      <div class="absolute inset-0 z-0 beach-background overflow-scroll">
        <!-- Header Start -->
        <header class="relative mx-auto w-full max-w-xl px-3 py-4 lg:px-0">
          <nav
            class="flex items-center justify-between rounded-2xl px-5 py-2 backdrop-blur-md"
          >
            <!-- Logo -->
            <a href="#" class="text-2xl font-bold tracking-tight text-zinc-900">
              june<span class="text-orange-600">.</span>
            </a>

            <!-- Navigation -->
            <div
              class="flex items-center gap-4 text-sm font-medium text-zinc-800"
            >
              <a href="#work" class="transition hover:text-orange-600">@</a>
              <a href="#about" class="transition hover:text-orange-600"
                >About</a
              >
              <a href="#contact" class="transition hover:text-orange-600"
                >Contact</a
              >
            </div>
          </nav>
        </header>
        <!-- Header End -->
        <!-- Hero Section Start -->

        <div
          class="relative overflow-hidden before:absolute before:top-0 before:inset-s-1/2 before:bg-[url('https://preline.co/assets/svg/examples/squared-bg-element.svg')] dark:before:bg-[url('https://preline.co/assets/svg/examples-dark/squared-bg-element.svg')] before:bg-no-repeat before:bg-top before:size-full before:-z-1 before:transform before:-translate-x-1/2"
        >
          <div class="max-w-340 mx-auto px-4 sm:px-6 lg:px-8 pt-20 pb-20">
            <!-- Announcement Banner -->
            <div class="flex justify-center">
              <a
                class="hover:bg-white hover:ring-2 hover:ring-rose-700 hover:ring-offset-1 hover:border-transparent hover:shadow-xl transition-all duration-300 ease-in-out inline-flex items-center gap-x-2 bg-layer border border-layer-line text-xs text-layer-foreground p-2 px-3 rounded-full"
                href="#"
              >
                The creature behind the brush
                <span class="flex items-center gap-x-1">
                  <span
                    class="border-s border-line-2 text-primary ps-2 text-rose-700"
                    >Find out who</span
                  >
                  <svg
                    class="shrink-0 size-4 text-primary"
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="m9 18 6-6-6-6" />
                  </svg>
                </span>
              </a>
            </div>
            <!-- End Announcement Banner -->

            <!-- Title -->
            <div class="mt-5 max-w-xl text-center mx-auto">
              <h1
                class="block font-bold text-foreground text-4xl md:text-5xl lg:text-6xl bg-gradient-to-br from-slate-950 via-slate-900 to-fuchsia-950/50 bg-clip-text text-transparent"
              >
                Hello, curious soul...
              </h1>
            </div>
            <!-- End Title -->

            <div class="mt-5 max-w-3xl text-center mx-auto">
              <p class="text-lg text-muted-foreground-2">
                I welcome you to my world, through an artist’s delightfully
                unusual lens...
              </p>
            </div>

            <!-- Buttons -->
            <div class="mt-8 gap-3 flex justify-center">
              <a
                class="transition-all duration-300 ease-in-out hover:scale-110 hover:shadow-xl bg-gradient-to-r from-orange-400 via-rose-500 to-purple-600 inline-flex justify-center items-center gap-x-3 text-center text-sm text-white font-medium rounded-full py-3 px-4"
                href="#"
              >
                Proceed With Curiosity
              </a>
            </div>
            <!-- End Buttons -->
          </div>
        </div>
        <!-- Hero Section End -->
      </div>
      <!-- Beach Background Effects End -->
    </main>
  </body>
</html>
